name: Deploy NTC93 design preview
on:
  push:
    branches: [main]
    paths: ['site/**', 'tools/**', '.github/workflows/preview.yml']
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ntc93-preview
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare local copies of verified club images
        if: github.event_name != 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/media
          python3 - <<'PY'
          import pathlib, subprocess
          p = pathlib.Path('site/index.html')
          s = p.read_text()
          assets = {
              'https://ntc93.com/wp-content/uploads/2023/06/Logo_ausgeschnitten_1-300x300.png': 'logo.png',
              'https://ntc93.com/wp-content/uploads/2024/06/IMG_20240623_144051-1024x576.jpg': 'anlage.jpg',
              'https://ntc93.com/wp-content/uploads/2024/02/1000062201-1024x461.jpg': 'halle.jpg',
              'https://ntc93.com/wp-content/uploads/2023/06/ekxepi7v-1024x576.png': 'verein.png',
              'https://ntc93.com/wp-content/uploads/2024/06/IMG_20240623_143321-1024x576.jpg': 'terrasse.jpg',
          }
          for url, name in assets.items():
              if url not in s: continue
              subprocess.run(['curl','-fsSL','--retry','2','--max-time','60',url,'-o','site/media/'+name],check=True)
              s = s.replace(url,'media/'+name)
          p.write_text(s)
          PY
      - name: Install public data import dependencies
        run: python3 -m pip install --disable-pip-version-check beautifulsoup4 requests
      - name: Refresh public nuLiga matches
        shell: bash
        run: |
          set -euo pipefail
          if ! python3 tools/matchcenter.py; then
            echo "::warning::nuLiga refresh failed. Existing remote match data remains unchanged."
            [[ "$GITHUB_EVENT_NAME" != schedule ]] || exit 1
          fi
      - name: Refresh public nuLiga teams and group standings
        shell: bash
        run: |
          set -euo pipefail
          # Retain known-good public group data if an individual nuLiga request fails.
          trap 'rm -f site/teams-previous.json' EXIT
          curl --fail --silent --show-error --connect-timeout 8 --max-time 25 "https://neu.ntc93.de/teams.json?previous=$GITHUB_RUN_ID" -o site/teams-previous.json || rm -f site/teams-previous.json
          if ! python3 tools/teams.py; then
            echo "::warning::nuLiga team import failed. Existing remote team data remains unchanged."
          fi
      - name: Validate PHP and JavaScript syntax
        if: github.event_name != 'schedule'
        run: |
          php -l site/admin/index.php
          php -l site/admin/import-content.php
          python3 -m py_compile tools/export_cms.py
          node --check site/cms-public.js
          node --check site/club-enhancements.js
          node --check site/matchcenter.js
          node --check site/teams.js
          python3 -m py_compile tools/teams.py
          python3 -m py_compile tools/import_pages.py tools/archive_import.py tools/localize.py
      - name: Restore downloaded public media
        if: github.event_name != 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: |
            site/media/import
            site/media/ntc-drohnenflug-hero.mp4
            site/media/ntc-drohnenflug-poster.jpg
            site/media/ntc-drohnenflug-original.mp4
          key: ntc-public-media-${{ github.run_id }}
          restore-keys: ntc-public-media-
      - name: Ensure FFmpeg for local drone video conversion
        if: github.event_name != 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | sed -n '1p'
      - name: Build public subpages
        if: github.event_name != 'schedule'
        run: python3 tools/import_pages.py
      - name: Save downloaded media independently of deployment
        if: github.event_name != 'schedule'
        uses: actions/cache/save@v4
        with:
          path: |
            site/media/import
            site/media/ntc-drohnenflug-hero.mp4
            site/media/ntc-drohnenflug-poster.jpg
            site/media/ntc-drohnenflug-original.mp4
          key: ntc-public-media-${{ github.run_id }}
      - name: Prepare private CMS content import
        if: github.event_name != 'schedule'
        run: python3 tools/export_cms.py
      - name: Save archive migration report
        if: github.event_name != 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: migration-report
          path: site/migration-report.json
      - name: Verify isolated FTPS target and publish preview
        timeout-minutes: 45
        env:
          CMS_DB_HOST: ${{ secrets.CMS_DB_HOST }}
          CMS_DB_NAME: ${{ secrets.CMS_DB_NAME }}
          CMS_DB_USER: ${{ secrets.CMS_DB_USER }}
          CMS_DB_PASSWORD: ${{ secrets.CMS_DB_PASSWORD }}
          CMS_SETUP_TOKEN: ${{ secrets.CMS_SETUP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$FTP_SERVER" && -n "$FTP_USERNAME" && -n "$FTP_PASSWORD" ]]
          [[ "$FTP_SERVER" =~ ^[a-zA-Z0-9.-]+(:[0-9]+)?$ ]]
          upload() {
            curl --fail --silent --show-error --ssl-reqd --ftp-create-dirs \
              --connect-timeout 20 --max-time 120 --user "$FTP_USERNAME:$FTP_PASSWORD" \
              --upload-file "$1" "ftp://$FTP_SERVER/$2"
          }
          probe="ntc93-preview-check-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          printf '%s' "$(openssl rand -hex 32)" > "$RUNNER_TEMP/probe.txt"
          upload "$RUNNER_TEMP/probe.txt" "$probe"
          status=$(curl --silent --show-error --connect-timeout 15 --max-time 30 --output "$RUNNER_TEMP/received.txt" --write-out '%{http_code}' "https://neu.ntc93.de/$probe")
          [[ "$status" == 200 ]] && cmp -s "$RUNNER_TEMP/probe.txt" "$RUNNER_TEMP/received.txt" || { echo 'FTPS directory not confirmed as neu.ntc93.de, or HTTP access protected. No website files uploaded.'; exit 1; }
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            upload site/matches.json matches.json
            status=$(curl --silent --show-error --max-time 30 --output "$RUNNER_TEMP/matches.txt" --write-out '%{http_code}' "https://neu.ntc93.de/matches.json?run=$GITHUB_RUN_ID")
            [[ "$status" == 200 ]] && cmp -s site/matches.json "$RUNNER_TEMP/matches.txt" || { echo "Match data verification failed"; exit 1; }
            if [[ -f site/teams.json ]]; then
              upload site/teams.json teams.json
              curl --fail --silent --show-error --max-time 40 "https://neu.ntc93.de/teams.json?run=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/teams-verified.json"
              cmp -s site/teams.json "$RUNNER_TEMP/teams-verified.json"
              echo 'Team tables refreshed and verified.'
            fi
            echo 'Match data refreshed and verified.'
            exit 0
          fi
          # Protect the private directory first, even on a new installation.
          upload site/admin/private/.htaccess admin/private/.htaccess
          # Provision the administration application before the large public-site upload.
          upload site/admin/admin.css admin/admin.css
          upload site/admin/import-content.php admin/import-content.php
          upload site/admin/index.php admin/index.php
          if [[ -n "$CMS_DB_NAME" && -n "$CMS_DB_USER" && -n "$CMS_DB_PASSWORD" && ${#CMS_SETUP_TOKEN} -ge 32 ]]; then
            # Verify Apache blocks the private config directory before provisioning credentials.
            upload site/admin/private/.htaccess admin/private/.htaccess
            printf '%s' 'private directory test' > "$RUNNER_TEMP/private-check.txt"
            upload "$RUNNER_TEMP/private-check.txt" admin/private/private-check.txt
            status=$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' "https://neu.ntc93.de/admin/private/private-check.txt")
            [[ "$status" == 403 ]] || { echo 'Private directory not protected; CMS credentials not uploaded.'; exit 1; }
            php -r '$c=["dsn"=>"mysql:host=".(getenv("CMS_DB_HOST")?: "localhost").";dbname=".getenv("CMS_DB_NAME").";charset=utf8mb4","db_user"=>getenv("CMS_DB_USER"),"db_password"=>getenv("CMS_DB_PASSWORD"),"setup_token"=>getenv("CMS_SETUP_TOKEN")]; file_put_contents($argv[1],"<?php\nreturn ".var_export($c,true).";\n");' "$RUNNER_TEMP/cms-config.php"
            upload "$RUNNER_TEMP/cms-config.php" admin/private/config.php
            rm -f "$RUNNER_TEMP/cms-config.php"
          else
            echo 'CMS database secrets not yet configured; leaving any existing local configuration untouched.'
          fi
          # Resume verified transfers using a checkpoint saved after each batch.
          curl --fail --silent --show-error --max-time 25 \
            "https://neu.ntc93.de/ntc-deploy-manifest.json?run=$GITHUB_RUN_ID&attempt=$GITHUB_RUN_ATTEMPT" \
            -o "$RUNNER_TEMP/previous-manifest.json" || rm -f "$RUNNER_TEMP/previous-manifest.json"
          python3 -u - <<'PY'
          import hashlib, json, os, pathlib, subprocess, time
          from urllib.parse import quote
          root=pathlib.Path('site')
          tmp=pathlib.Path(os.environ['RUNNER_TEMP'])
          credentials=os.environ['FTP_USERNAME']+':'+os.environ['FTP_PASSWORD']
          server=os.environ['FTP_SERVER']
          try:
              old=json.loads((tmp/'previous-manifest.json').read_text())
              if not isinstance(old,dict):old={}
          except (OSError,ValueError):
              old={}
          files={}
          for p in sorted(root.rglob('*')):
              if not p.is_file():continue
              rel=p.relative_to(root).as_posix()
              if rel in ('index.html','migration-report.json','matches.json','teams.json','ntc-deploy-manifest.json') or rel.startswith('admin/private/'):
                  continue
              files[rel]=hashlib.sha256(p.read_bytes()).hexdigest()
          # A hash is retained only for an unchanged file or a confirmed transfer.
          confirmed={p:h for p,h in files.items() if old.get(p)==h}
          changed=[p for p in files if p not in confirmed]
          print(f'Upload plan: {len(changed)} changed files; {len(confirmed)} unchanged; {len(files)} total',flush=True)
          def transfer_args(local,remote,method='singlecwd'):
              return ['--fail','--silent','--show-error','--ssl-reqd','--ftp-create-dirs',
                      '--ftp-method',method,'--connect-timeout','20','--max-time','90',
                      '--user',credentials,'--upload-file',str(local),
                      'ftp://'+server+'/'+quote(remote,safe='/')]
          def checkpoint():
              p=tmp/'next-manifest.json'
              p.write_text(json.dumps(confirmed,separators=(',',':')))
              subprocess.run(['curl']+transfer_args(p,'ntc-deploy-manifest.json'),check=True)
          # Drop stale hashes before modifying files, including on interrupted runs.
          checkpoint()
          def one(rel):
              for method in ('singlecwd','multicwd','singlecwd'):
                  result=subprocess.run(['curl']+transfer_args(root/rel,rel,method))
                  if result.returncode==0:
                      confirmed[rel]=files[rel]
                      return True
                  print(f'Retrying {rel}: curl exit {result.returncode} ({method})',flush=True)
                  time.sleep(2)
              return False
          # Parallel transfers may be rejected by shared hosting. Retry failed
          # batches individually and keep confirmed progress.
          failures=[]
          for offset in range(0,len(changed),30):
              batch=changed[offset:offset+30]
              args=['curl','--parallel','--parallel-max','2','--fail-early']
              for i,rel in enumerate(batch):
                  if i:args.append('--next')
                  args.extend(transfer_args(root/rel,rel))
                  args.extend(['--write-out',rel.replace('%','%%')+' : %{exitcode}\n'])
              result=subprocess.run(args,capture_output=True,text=True)
              for line in result.stdout.splitlines():
                  if ' : ' not in line:continue
                  rel,code=line.rsplit(' : ',1)
                  if rel in batch and code=='0':confirmed[rel]=files[rel]
              if result.returncode:
                  print('Parallel transfer rejected; retrying only unfinished files:',flush=True)
              for rel in batch:
                  if rel not in confirmed and not one(rel):failures.append(rel)
              checkpoint()
              print(f'Confirmed {len(confirmed)}/{len(files)} files',flush=True)
              if failures:
                  print('Persistent FTPS failures: '+', '.join(failures),flush=True)
                  raise SystemExit('Upload interrupted; confirmed files retained for next run')
          if len(confirmed)!=len(files):raise SystemExit('Incomplete deployment')
          (tmp/'next-manifest.json').write_text(json.dumps(files,separators=(',',':')))
          PY
          # Match data is updated independently of the website manifest.
          if [[ -f site/matches.json ]]; then
            upload site/matches.json matches.json
          fi
          if [[ -f site/teams.json ]]; then
            upload site/teams.json teams.json
            curl --fail --silent --show-error --max-time 40 "https://neu.ntc93.de/teams.json?run=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/teams-verified.json"
            cmp -s site/teams.json "$RUNNER_TEMP/teams-verified.json"
          fi
          upload site/index.html index.html
          # Verify the news page was uploaded, not just the homepage.
          curl --fail --silent --show-error --max-time 60 'https://neu.ntc93.de/news/' -o "$RUNNER_TEMP/news.html"
          cmp -s site/news/index.html "$RUNNER_TEMP/news.html"
          # If the build prepared a drone video, verify the deployed media.
          if [[ -f site/media/ntc-drohnenflug-hero.mp4 ]]; then
            curl --fail --silent --show-error --max-time 60 "https://neu.ntc93.de/media/ntc-drohnenflug-hero.mp4?run=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/drone-hero.mp4"
            cmp -s site/media/ntc-drohnenflug-hero.mp4 "$RUNNER_TEMP/drone-hero.mp4"
            echo 'Drone hero video uploaded and verified.'
          fi
          curl --fail --silent --show-error --max-time 60 'https://neu.ntc93.de/anfahrt/' -o "$RUNNER_TEMP/arrival.html"
          cmp -s site/anfahrt/index.html "$RUNNER_TEMP/arrival.html"
          status=$(curl --silent --show-error --max-time 30 --output "$RUNNER_TEMP/index.txt" --write-out '%{http_code}' 'https://neu.ntc93.de/index.html')
          [[ "$status" == 200 ]] && cmp -s site/index.html "$RUNNER_TEMP/index.txt" || { echo "Homepage verification failed"; exit 1; }
          # Deliver the private import only after all referenced public files are present.
          printf '%s' 'private directory test' > "$RUNNER_TEMP/private-check.txt"
          upload "$RUNNER_TEMP/private-check.txt" admin/private/private-check.txt
          status=$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' "https://neu.ntc93.de/admin/private/private-check.txt?run=$GITHUB_RUN_ID")
          [[ "$status" == 403 ]] || { echo 'Private directory not protected; CMS content seed not uploaded.'; exit 1; }
          upload site/admin/private/content-seed.json admin/private/content-seed.json
          upload "$RUNNER_TEMP/next-manifest.json" ntc-deploy-manifest.json
          curl --fail --silent --show-error --max-time 30 \
            "https://neu.ntc93.de/ntc-deploy-manifest.json?run=$GITHUB_RUN_ID" \
            -o "$RUNNER_TEMP/verified-manifest.json"
          cmp -s "$RUNNER_TEMP/next-manifest.json" "$RUNNER_TEMP/verified-manifest.json"
          echo 'Preview deployed and verified.'
